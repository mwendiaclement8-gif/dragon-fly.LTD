<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragonfly — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060a; --card:#11141f; --line:rgba(255,255,255,.09);
    --text:#e9ecf5; --muted:#9aa3b8;
    --c1:#00e6c3; --c2:#6c5ce7; --c3:#ff5c8a;
    --grad:linear-gradient(120deg,#00e6c3,#6c5ce7 50%,#ff5c8a);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:grid;place-items:center;overflow:hidden;
    position:relative;padding:20px;
  }
  /* animated bg */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 18s ease-in-out infinite;z-index:-1}
  .b1{width:480px;height:480px;background:var(--c1);top:-160px;left:-120px}
  .b2{width:440px;height:440px;background:var(--c2);bottom:-180px;right:-140px;animation-delay:-8s}
  .b3{width:360px;height:360px;background:var(--c3);top:40%;left:45%;animation-delay:-4s;opacity:.2}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}

  .card{
    width:100%;max-width:440px;
    background:rgba(17,20,31,.75);
    backdrop-filter:blur(22px);
    border:1px solid var(--line);
    border-radius:26px;padding:42px 34px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both;
    position:relative;
  }
  @keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
  .card::before{
    content:"";position:absolute;inset:-1px;border-radius:26px;z-index:-1;
    background:var(--grad);opacity:.25;filter:blur(24px);
  }

  .logo{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Sora';font-weight:800;font-size:1.5rem;margin-bottom:6px;letter-spacing:-.5px;
  }
  .logo-mark{
    width:42px;height:42px;border-radius:12px;background:var(--grad);
    display:grid;place-items:center;font-size:1.2rem;
    box-shadow:0 0 22px rgba(0,230,195,.5);
  }
  .subtitle{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:30px}

  /* tabs */
  .tabs{
    display:flex;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:28px;
  }
  .tab{
    flex:1;padding:11px;border:none;background:transparent;color:var(--muted);
    font-family:'Sora';font-weight:600;font-size:.9rem;border-radius:10px;
    cursor:pointer;transition:.3s;
  }
  .tab.active{background:var(--grad);color:#05060a;box-shadow:0 6px 20px rgba(108,92,231,.35)}

  .field{margin-bottom:18px;position:relative}
  .field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:8px;font-weight:500}
  .field input{
    width:100%;padding:14px 16px;border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    color:var(--text);font-family:'Inter';font-size:.95rem;
    transition:.25s;outline:none;
  }
  .field input:focus{
    border-color:var(--c1);
    background:rgba(0,230,195,.05);
    box-shadow:0 0 0 4px rgba(0,230,195,.1);
  }
  .field input::placeholder{color:#5a6178}
  .field .toggle-pw{
    position:absolute;right:14px;top:38px;background:none;border:none;
    color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;
  }
  .row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:.83rem}
  .row-between label{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
  .row-between a{color:var(--c1);text-decoration:none}
  .row-between a:hover{text-decoration:underline}

  .btn-submit{
    width:100%;padding:15px;border:none;border-radius:13px;
    background:var(--grad);color:#05060a;
    font-family:'Sora';font-weight:700;font-size:1rem;letter-spacing:.3px;
    cursor:pointer;transition:.3s;
    box-shadow:0 10px 30px rgba(0,230,195,.28);
    position:relative;overflow:hidden;
  }
  .btn-submit:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(108,92,231,.5)}
  .btn-submit:active{transform:translateY(0)}
  .btn-submit .arrow{display:inline-block;transition:.3s}
  .btn-submit:hover .arrow{transform:translateX(4px)}

  .divider{
    display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--muted);font-size:.78rem;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .socials{display:flex;gap:12px}
  .socials button{
    flex:1;padding:12px;border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    color:var(--text);font-family:'Sora';font-weight:600;font-size:.88rem;
    cursor:pointer;transition:.25s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .socials button:hover{border-color:var(--c1);background:rgba(0,230,195,.06)}

  .back-link{text-align:center;margin-top:22px;font-size:.83rem;color:var(--muted)}
  .back-link a{color:var(--c1);text-decoration:none}

  /* hide/signup states */
  .form-block{display:none}
  .form-block.active{display:block;animation:fade .4s both}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .msg{
    display:none;padding:12px 16px;border-radius:11px;margin-bottom:18px;
    font-size:.86rem;text-align:center;
  }
  .msg.ok{display:block;background:rgba(0,230,195,.1);border:1px solid rgba(0,230,195,.4);color:var(--c1)}
  .msg.err{display:block;background:rgba(255,92,138,.1);border:1px solid rgba(255,92,138,.4);color:var(--c3)}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="card">
  <div class="logo"><span class="logo-mark">🐉</span> Dragonfly</div>
  <p class="subtitle">Premium digital assets — sign in to continue</p>

  <div class="tabs">
    <button class="tab active" data-target="login">Sign In</button>
    <button class="tab" data-target="signup">Sign Up</button>
  </div>

  <div class="msg" id="msg"></div>

  <!-- LOGIN FORM -->
  <div class="form-block active" id="login">
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required />
        <button type="button" class="toggle-pw">Show</button>
      </div>
      <div class="row-between">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="btn-submit">Sign In <span class="arrow">→</span></button>
    </form>
  </div>

  <!-- SIGNUP FORM -->
  <div class="form-block" id="signup">
    <form id="signupForm" novalidate>
      <div class="field">
        <label>Full name</label>
        <input type="text" name="name" placeholder="Jane Doe" required />
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 8 characters" required />
        <button type="button" class="toggle-pw">Show</button>
      </div>
      <div class="row-between">
        <label><input type="checkbox" required /> I agree to the Terms</label>
      </div>
      <button type="submit" class="btn-submit">Create Account <span class="arrow">→</span></button>
    </form>
  </div>

  <div class="divider">or continue with</div>
  <div class="socials">
    <button type="button">🔵 Google</button>
    <button type="button">⚫ GitHub</button>
  </div>

  <p class="back-link">← <a href="index.html">Back to home</a></p>
</div>

<script>
  // tab switching
  const tabs = document.querySelectorAll('.tab');
  const blocks = document.querySelectorAll('.form-block');
  const msg = document.getElementById('msg');

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    blocks.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.target).classList.add('active');
    msg.className = 'msg';
  }));

  // show / hide password
  document.querySelectorAll('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = btn.previousElementSibling;
      if(input.type === 'password'){ input.type='text'; btn.textContent='Hide'; }
      else { input.type='password'; btn.textContent='Show'; }
    });
  });

  // helper
  function showMsg(text, ok=true){
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    setTimeout(()=>{ msg.className='msg'; }, 4000);
  }

  // LOGIN submit — placeholder (replace with real backend)
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if(!f.email.value || !f.password.value) return showMsg('Please fill in all fields.', false);
    showMsg('Welcome back! Redirecting to dashboard…');
    setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
  });

  // SIGNUP submit — placeholder (replace with real backend)
  document.getElementById('signupForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if(!f.name.value || !f.email.value || f.password.value.length < 8)
      return showMsg('Please complete all fields (password ≥ 8 chars).', false);
    showMsg('Account created! You can now sign in.');
    setTimeout(()=>{
      document.querySelector('.tab[data-target="login"]').click();
      f.reset();
    }, 1400);
  });
</script>
</body>
</html>
